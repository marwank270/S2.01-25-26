<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Memory</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
        <h1>Jeu de Memory</h1>
    </header>

    <div class="setup-form">
      <h2>Démarrer une nouvelle partie</h2>

      <form class="game-form">
        <label for="pseudo">Nom d'utilisateur: (3-15 caractères)</label>
        <input
          type="text"
          id="pseudo"
          name="pseudo"
          required
          minlength="3"
          maxlength="15"
        />

        <label for="difficulty">Difficulté:</label>
        <select id="difficulty" name="difficulty" required>
          <option value="4">4 paires</option>
          <option value="5">5 paires</option>
          <option value="6">6 paires</option>
          <option value="8">8 paires</option>
        </select>

        <label for="collection">Collection d'images:</label>
        <select id="collection" name="collection" required>
          <option value="animaux">Animaux</option>
          <option value="nature">Nature</option>
          <option value="fruits">Fruits</option>
          <option value="emoji">Emoji</option>
        </select>

        <button type="submit">Démarrer la partie</button>
      </form>
    </div>

    <div class="game-area hidden">
      <div class="game-area-header">
        <div class="game-timer">00:00</div>
      </div>
      <div class="game-board">
        
      </div>
    </div>
    <script src="js/app.js" type="module"></script>
  </body>
</html>
