<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu de Memory</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <header>
        <h1>Jeu de Memory</h1>
    </header>

    <div class="game-area hidden">
      <div class="game-area-header">
        <div class="game-timer"></div>
        <button id="abandon">Abandonner la partie</button>
      </div>
      <div class="sound-container"></div>
      <div class="game-board">
      </div>
    </div>
    
    <div class="setup-form">
      <form class="game-form"></form>
    </div>
    <div class="speedrun-stats hidden"></div>

    <div id="win-box" class="win-popup hidden">
      <div class="win-content">
        <h2 id="win-title"></h2>
        <p>Paires trouvées: <strong id="pairs-count">0/0</strong></p>
        <p><strong id="time-count">00:00.0</strong></p>
        <button id="btn-new-game">Nouvelle partie</button>
      </div>
    </div>

    <script src="js/app.js" type="module"></script>
  </body>
  <footer>
    <p>&copy; 2026 Marwan K. Développé dans le cadre de la S2.01.</p>
  </footer>
</html>
